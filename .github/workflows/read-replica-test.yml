name: Docker Image CI

on:
  push:
    branches: [ "docker-github-action-testing" ]
  pull_request:
    branches: [ "docker-github-action-testing" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HBase Repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        # This action ensures Docker Compose is installed and available
        uses: docker/setup-compose-action@v2

      - name: Install Python Requirements
        run: |
          pip install -r dev-support/integration-test/read-replica/requirements.txt

      - name: Prepare Host Data Directory
        run: |
          python --version
          python3 --version
          # Create the directory on the runner host
          mkdir -p /home/runner/data-store/hbase /home/runner/data-store/run \
                   /home/runner/data-store/logs /home/runner/data-store/zk
          # Change ownership to UID 1000 (matches 'hbase' user in Dockerfile)
          sudo chown -R 1000:1000 /home/runner/data-store

      - name: Start Docker Clusters
        run: |
          docker compose -f dev-support/integration-test/read-replica/docker-compose.test.yml up -d
          echo "Waiting for HBase clusters to initialize..."
          # dev-support/integration-test/read-replica/verify-hbase-start.sh
          python3 dev-support/integration-test/read-replica/verify_hbase_start.py
          echo "Clusters are up!"

      - name: Test Table Creation Behavior
        run: |
          python3 dev-support/integration-test/read-replica/test_table_creation_behavior.py

      - name: Clean up
        run: docker compose -f dev-support/integration-test/read-replica/docker-compose.test.yml down

      - name: Dump Logs on Failure
        if: failure()
        run: |
          docker logs hbase-docker
          docker logs hbase-docker-2
