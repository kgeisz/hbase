name: Docker Image CI

on:
  push:
    branches: [ "docker-github-action-testing" ]
  # pull_request:
  #   branches: [ "docker-github-action-testing" ]

jobs:
  integration-test:
    env:
      REPLICA_BASE_DIR: ./dev-support/integration-test/read-replica
    defaults:
      run:
        working-directory: ${{ env.REPLICA_BASE_DIR }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HBase Repository
        uses: actions/checkout@v4

      - name: Checkout HBASE-29081 Read-Replica Feature Branch
        uses: actions/checkout@v4
        with: 
          # If it's a PR, then use the PR's head SHA. Otherwise, use HBASE-29081.
          ref: ${{ github.event.pull_request.head.sha || 'HBASE-29081' }}
          path: ${{ env.REPLICA_BASE_DIR }}/hbase

      - name: Load .env File into GitHub Actions Environment
        run: |
          echo "=== Parsing .env file and exporting to GITHUB_ENV ==="
          echo "Currently in directory: $(pwd)"
          while IFS= read -r line || [ -n "$line" ]; do
            # Skip comments, empty lines, and internal parser annotations
            [[ "$line" =~ ^# ]] && continue
            [[ "$line" =~ ^\[source ]] && continue
            [[ -z "$line" ]] && continue

            if [[ "$line" =~ ^([^=]+)=(.*)$ ]]; then
              key="${BASH_REMATCH[1]}"
              val="${BASH_REMATCH[2]}"

              # Strip trailing comments and whitespace
              val="${val%%#*}"
              key=$(echo "$key" | xargs)
              val=$(echo "$val" | xargs)

              # Evaluate the string to expand variables like ${RUNNER_TEMP} or ${GITHUB_WORKSPACE}
              eval "expanded_val=\"$val\""

              # Export to the runner's environment
              echo "$key=$expanded_val" >> $GITHUB_ENV
              echo "Loaded: $key=$expanded_val"
            fi
          done < .env

      - name: Set up Docker Compose
        # This action ensures Docker Compose is installed and available
        uses: docker/setup-compose-action@v2

      - name: Install Python Requirements
        run: |
          echo "Current dir: $(pwd)"
          echo "github.workspace = ${{ github.workspace }}"
          echo "Current dir contents:"
          ls -la
          echo "Listing GITHUB_WORKSPACE = ${GITHUB_WORKSPACE}"
          ls -la ${GITHUB_WORKSPACE}
          pip install -r requirements.txt

      - name: Set Python Path
        run: |
          echo "Current dir: $(pwd)"
          echo "PYTHONPATH=$(pwd)" >> ${GITHUB_ENV}

      - name: Compile Protobuf
        run: |
          echo "Current dir: $(pwd)"
          echo "Copying ActiveClusterSuffix.proto from HBase repo to have latest version"
          cp hbase/hbase-protocol-shaded/src/main/protobuf/server/ActiveClusterSuffix.proto \
             python/proto
          python3 python/proto/proto_compiler.py

      - name: Prepare Host Data Directory
        run: |
          # Create the data-store directory at /home/runner/work/_temp
          echo "HBASE_DATA_STORE_ROOT = ${HBASE_DATA_STORE_ROOT}"
          mkdir -p ${HBASE_DATA_STORE_ROOT}/data-store/hbase ${HBASE_DATA_STORE_ROOT}/data-store/run \
                   ${HBASE_DATA_STORE_ROOT}/data-store/logs ${HBASE_DATA_STORE_ROOT}/data-store/zk
          chmod -R 777 ${HBASE_DATA_STORE_ROOT}
          # Change ownership to UID 1000 (matches 'hbase' user in Dockerfile)
          # sudo chown -R 1000:1000 ${HBASE_DATA_STORE_ROOT}/data-store

      # - name: Build Docker Image
      #   run: |
      #     echo "Building docker image"
      #     ./build-images.sh
      #     echo "Listing Docker images"
      #     docker image ls

      - name: Start HBase Docker Containers
        run: |
          echo "PYTHONPATH = ${PYTHONPATH}"
          docker compose -f docker-compose.yml up -d
          echo "Waiting for HBase clusters to initialize..."
          python3 python/scripts/verify_hbase_start.py
          echo "Clusters are up!"

      # - name: Test Table Create/Drop Behavior
      #   run: python3 python/scripts/test_create_drop_behavior.py

      # - name: Test Put/Get Behavior
      #   run: python3 python/scripts/test_put_get_behavior.py

      - name: Test Read-Only Flag Flipping
        run: |
          echo "Who am I?"
          whoami
          echo ""
          echo "Listing ${HBASE_DATA_STORE_ROOT}"
          ls -la "${HBASE_DATA_STORE_ROOT}"
          echo ""
          echo "Listing ${HBASE_DATA_STORE_ROOT}/data-store"
          ls -la "${HBASE_DATA_STORE_ROOT}/data-store"
          echo ""
          python3 python/scripts/test_read_only_flag_flipping.py

      - name: Clean up
        run: docker compose -f docker-compose.yml down

      - name: Dump Logs on Failure
        if: failure()
        run: |
          docker logs hbase-docker
          docker logs hbase-docker-2
