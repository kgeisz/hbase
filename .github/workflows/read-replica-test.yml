name: Docker Image CI

on:
  push:
    branches: [ "docker-github-action-testing" ]
  pull_request:
    branches: [ "docker-github-action-testing" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HBase Repository
        uses: actions/checkout@v4

      # - name: Set up Docker Compose
      #   # This action ensures Docker Compose is installed and available
      #   uses: docker/setup-compose-action@v2

      - name: Explore Filesystem Before Checkout
        run: |
          echo "Current directory:"
          pwd
          echo "Listing current directory: ls -la ."
          ls -la .
          echo "Listing GITHUB_WORKSPACE = ${GITHUB_WORKSPACE}"
          ls -la ${GITHUB_WORKSPACE}
          echo "Listing /home"
          ls -la /home
          echo "Listing /home/runner"
          ls -la /home/runner
          echo "Listing /home/runner/work"
          ls -la /home/runner/work/
          echo "Listing /home/runner/work/hbase"
          ls -la /home/runner/work/hbase
          echo "Listing /home/runner/work/hbase/hbase"
          ls -la /home/runner/work/hbase/hbase

      - name: Checkout HBASE-29081 Read-Replica Feature Branch
        uses: actions/checkout@v4
        with: 
          ref: HBASE-29081
          path: dev-support/integration-test/read-replica/hbase

      - name: Explore Filesystem After Checkout
        run: |
          echo "Running: ls -la dev-support/integration-test/read-replica"
          ls -la dev-support/integration-test/read-replica
          echo "Current directory:"
          pwd
          echo "Listing current directory: ls -la ."
          ls -la .
          echo "Listing GITHUB_WORKSPACE = ${GITHUB_WORKSPACE}"
          ls -la ${GITHUB_WORKSPACE}
          echo "Listing /home"
          ls -la /home
          echo "Listing /home/runner"
          ls -la /home/runner
          echo "Listing /home/runner/work"
          ls -la /home/runner/work/
          echo "Listing /home/runner/work/hbase"
          ls -la /home/runner/work/hbase
          echo "Listing /home/runner/work/hbase/hbase"
          ls -la /home/runner/work/hbase/hbase
          echo "Listing /home/runner/work/hbase/${READ_REPLICA_DIR}"
          ls -la /home/runner/work/hbase/${READ_REPLICA_DIR}
          echo "Listing /home/runner/work/hbase/hbase/${READ_REPLICA_DIR}"
          ls -la /home/runner/work/hbase/hbase/${READ_REPLICA_DIR}
          echo "Running cd /home/runner/work/hbase/hbase"
          cd /home/runner/work/hbase/hbase
          echo "Running git log | head -n 20"
          git log | head -n 20

