name: Docker Image CI

on:
  push:
    branches: [ "docker-github-action-testing" ]
  pull_request:
    branches: [ "docker-github-action-testing" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HBase Repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        # This action ensures Docker Compose is installed and available
        uses: docker/setup-compose-action@v2

      - name: Start Docker Clusters
        run: |
          docker compose -f dev-support/integration-test/read-replica/docker-compose.test.yml up -d
          echo "Waiting for HBase clusters to initialize..."
          # Self-healing check: Wait for Master UI to return 200 OK
          echo "waiting 15 seconds"
          sleep 15
          echo "running 'curl http://hbase-docker:16010'"
          curl http://hbase-docker:16010
          # until $(curl --output /dev/null --silent --head --fail http://hbase-docker:16010); do
          #   printf '.'
          #   sleep 5
          # done
          # echo "Clusters are up!"

      - name: Check container status (optional)
        run: docker compose -f dev-support/integration-test/read-replica/docker-compose.test.yml ps

      - name: Clean up
        # This step runs automatically as a post-hook in many actions,
        # but you can also explicitly call it.
        run: docker compose -f dev-support/integration-test/read-replica/docker-compose.test.yml down
